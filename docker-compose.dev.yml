services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    image: node:24.14.1-trixie
    container_name: open-forms-back-dev
    user: "node"
    stdin_open: true
    tty: true
    env_file: .env
    ports:
      - "3000:3000"
    working_dir: /usr/src/app
    volumes:
      - ./back:/usr/src/app
    depends_on:
      - postgres
      - redis
    command: tail -f /dev/null

  front:
    image: node:24.14.1-trixie
    container_name: open-forms-front-dev
    user: "node"
    stdin_open: true
    tty: true
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./front:/usr/src/app
    depends_on:
      - back
    command: tail -f /dev/null

volumes:
  postgres_data:
