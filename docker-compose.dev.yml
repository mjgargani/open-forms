services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  back:
    build:
      context: ./back
      target: development
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./back:/usr/src/app
    depends_on:
      - postgres
      - redis

  front:
    build:
      context: ./front
      target: development
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./front:/usr/src/app
    depends_on:
      - back

volumes:
  postgres_data:
